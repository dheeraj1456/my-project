<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatePass Portal | Secure Access</title>
    <!-- Phospor Icons for sleek iconography -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            position: relative;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .auth-tabs {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: var(--radius-md);
            padding: 0.3rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 0.8rem;
            text-align: center;
            border-radius: calc(var(--radius-md) - 4px);
            cursor: pointer;
            z-index: 1;
            font-weight: 500;
            color: var(--text-muted);
            transition: var(--transition-fast);
        }

        .tab-btn.active {
            color: white;
            background: rgba(255,255,255,0.1);
            box-shadow: var(--shadow-sm);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .auth-form.active {
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }

        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Ambient background decoration */
        .ambient-blob {
            position: absolute;
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
            pointer-events: none;
        }
        .blob-1 { width: 300px; height: 300px; background: var(--primary); top: -100px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -150px; right: -150px; }
    </style>
</head>
<body>

    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div class="auth-wrapper">
        <div class="glass-panel auth-container p-8 animate-fade-in" style="padding: 2.5rem;">
            
            <div class="auth-header">
                <i class="ph-fill ph-shield-check"></i>
                <h1 class="text-gradient">GatePass Pro</h1>
                <p class="text-muted" style="margin-top: 0.5rem;">Secure campus movement.</p>
            </div>

            <div class="auth-tabs">
                <div class="tab-btn active" onclick="switchTab('login')">Login</div>
                <div class="tab-btn" onclick="switchTab('register')">Register</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="input-group">
                    <input type="text" id="loginUsername" class="input-control" placeholder=" " required autocomplete="off">
                    <label for="loginUsername">Username / Roll No.</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="loginPassword" class="input-control" placeholder=" " required>
                    <label for="loginPassword">Password</label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Sign In <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <input type="text" id="regUsername" class="input-control" placeholder=" " required autocomplete="off">
                    <label for="regUsername">Username / Roll No.</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="regPassword" class="input-control" placeholder=" " required>
                    <label for="regPassword">Password</label>
                </div>

                <div class="input-group">
                    <select id="regRole" class="input-control" required style="padding-top: 1.2rem;">
                        <option value="" disabled selected></option>
                        <option value="STUDENT">Student</option>
                        <option value="FACULTY">Faculty</option>
                        <option value="GUARD">Security Guard</option>
                    </select>
                    <label for="regRole">Role</label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Create Account <i class="ph-bold ph-user-plus"></i>
                </button>
            </form>

        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script>
        // Tab switching logic for UI
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if(tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }
    </script>
</body>
</html>
