<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard | GatePass Pro</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="ph-fill ph-shield-star"></i> Security Portal
        </div>
        <div class="flex items-center gap-4">
            <span>Welcome, <strong class="display-username text-gradient">Guard</strong></span>
            <button class="btn btn-outline" data-action="logout" style="padding: 0.5rem 1rem;">
                <i class="ph-bold ph-sign-out"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container grid" style="grid-template-columns: 1fr 1.5fr; margin-top: 2rem;">
        
        <!-- Left Column: Scanning Actions -->
        <div class="flex flex-col gap-4">
            
            <!-- Verify Pass -->
            <div class="glass-panel p-6 animate-fade-in" style="padding: 1.5rem;">
                <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem;">
                    <i class="ph-fill ph-qr-code"></i> Verify Gate Pass ID
                </h3>
                
                <form id="verifyForm" class="flex flex-col gap-3">
                    <div class="input-group" style="margin-bottom: 0;">
                        <input type="number" id="passId" class="input-control" placeholder=" " required>
                        <label for="passId">Gate Pass ID</label>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Verify Pass
                    </button>
                </form>

                <div id="verifyResult" style="margin-top: 1rem; display: none; padding: 1rem; border-radius: var(--radius-md); text-align: center; font-weight: 600; font-size: 1.2rem;">
                </div>
            </div>

            <!-- Campus Entry/Exit -->
            <div class="glass-panel p-6 animate-fade-in" style="padding: 1.5rem; animation-delay: 0.1s;">
                <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem;">
                    <i class="ph-fill ph-sign-in"></i> Campus Entry/Exit Scan
                </h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
                    Scan Student ID/Roll No to automatically log entry or exit.
                </p>
                <form id="scanForm" class="flex flex-col gap-3">
                    <div class="input-group" style="margin-bottom: 0;">
                        <input type="text" id="scanRollNo" class="input-control" placeholder=" " required autocomplete="off">
                        <label for="scanRollNo">Student Roll No.</label>
                    </div>
                    <button type="submit" class="btn btn-secondary" style="background: var(--primary); color: white;">
                        <i class="ph-bold ph-scan"></i> Scan ID
                    </button>
                </form>
            </div>
            
        </div>

        <!-- Right Column: Entry Logs -->
        <div class="glass-panel animate-fade-in" style="padding: 1.5rem; animation-delay: 0.2s;">
            <div class="flex justify-between items-center" style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem;">
                <h3><i class="ph-fill ph-clipboard-text"></i> Live Access Logs</h3>
                <button class="btn btn-outline" onclick="loadLogs()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
                    <i class="ph-bold ph-arrows-clockwise"></i> Refresh
                </button>
            </div>

            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 1px solid var(--border-glass);">
                            <th style="padding: 1rem 0.5rem; color: var(--text-muted); font-weight: 500;">Log ID</th>
                            <th style="padding: 1rem 0.5rem; color: var(--text-muted); font-weight: 500;">Roll No</th>
                            <th style="padding: 1rem 0.5rem; color: var(--text-muted); font-weight: 500;">Entry Time</th>
                            <th style="padding: 1rem 0.5rem; color: var(--text-muted); font-weight: 500;">Exit Time</th>
                            <th style="padding: 1rem 0.5rem; color: var(--text-muted); font-weight: 500;">Status</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                                <i class="ph ph-spinner ph-spin" style="font-size: 1.5rem;"></i> Loading logs...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Protected Route Check
            const user = checkAuth('GUARD');
            if(!user) return;

            loadLogs();
            window.loadLogs = loadLogs;

            // Handle Gate Pass Verification
            document.getElementById('verifyForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const passId = document.getElementById('passId').value;
                const resultDiv = document.getElementById('verifyResult');
                resultDiv.style.display = 'block';
                resultDiv.className = '';
                resultDiv.innerHTML = `<i class="ph ph-spinner ph-spin"></i> Verifying...`;
                resultDiv.style.background = 'rgba(255,255,255,0.1)';
                resultDiv.style.color = 'white';

                try {
                    const response = await fetch(`${API_BASE_URL}/pass/verify/${passId}`);
                    const statusText = await response.text();

                    resultDiv.innerText = statusText;

                    if(statusText === 'APPROVED') {
                        resultDiv.style.background = 'rgba(16, 185, 129, 0.2)';
                        resultDiv.style.color = 'var(--success)';
                        resultDiv.style.border = '1px solid var(--success)';
                        showToast('Pass Valid.', 'success');
                    } else if(statusText === 'NOT APPROVED') {
                        resultDiv.style.background = 'rgba(245, 158, 11, 0.2)';
                        resultDiv.style.color = 'var(--warning)';
                        resultDiv.style.border = '1px solid var(--warning)';
                        showToast('Pass not approved yet.', 'error');
                    } else { // FAKE QR
                        resultDiv.style.background = 'rgba(239, 68, 68, 0.2)';
                        resultDiv.style.color = 'var(--danger)';
                        resultDiv.style.border = '1px solid var(--danger)';
                        showToast('Invalid / Fake Pass!', 'error');
                    }

                } catch(e) {
                    resultDiv.innerText = 'Verification Failed';
                    showToast('Server error.', 'error');
                }
                
                document.getElementById('verifyForm').reset();
            });

            // Handle Campus Entry/Exit Scan
            document.getElementById('scanForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const rollNo = document.getElementById('scanRollNo').value;
                
                try {
                    const response = await fetch(`${API_BASE_URL}/entry/scan`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rollNo })
                    });

                    if(response.ok) {
                        const data = await response.json();
                        // Based on whether exitTime is null or not we know if they entered or exited
                        if(data.exitTime) {
                            showToast(`${rollNo} EXITED the campus successfully.`, 'info');
                        } else {
                            showToast(`${rollNo} ENTERED the campus successfully.`, 'success');
                        }
                        loadLogs(); // Refresh table
                    } else {
                        showToast('Failed to record scan.', 'error');
                    }
                } catch(e) {
                    showToast('Server error.', 'error');
                }

                document.getElementById('scanForm').reset();
            });
        });

        // Load Logs into Table
        async function loadLogs() {
            try {
                const response = await fetch(`${API_BASE_URL}/entry/all`);
                let data = await response.json();
                const tbody = document.getElementById('logsTableBody');
                
                tbody.innerHTML = '';

                // newest first
                data.sort((a,b) => b.id - a.id);

                if(data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                                No logs found.
                            </td>
                        </tr>
                    `;
                    return;
                }

                data.forEach(log => {
                    const entryT = log.entryTime ? new Date(log.entryTime).toLocaleString() : '-';
                    const exitT = log.exitTime ? new Date(log.exitTime).toLocaleString() : '-';
                    
                    let statusBadge = `<span class="badge badge-success" style="background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3);">INSIDE</span>`;
                    
                    if(log.exitTime) {
                        statusBadge = `<span class="badge" style="background: rgba(255, 255, 255, 0.1); color: var(--text-muted); border: 1px solid var(--border-glass);">LEFT</span>`;
                    }

                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                    tr.innerHTML = `
                        <td style="padding: 1rem 0.5rem; color: var(--text-muted);">#${log.id}</td>
                        <td style="padding: 1rem 0.5rem; font-weight: 600;">${log.rollNo}</td>
                        <td style="padding: 1rem 0.5rem; font-size: 0.85rem;">${entryT}</td>
                        <td style="padding: 1rem 0.5rem; font-size: 0.85rem; color: var(--text-muted);">${exitT}</td>
                        <td style="padding: 1rem 0.5rem;">${statusBadge}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch(e) {
                document.getElementById('logsTableBody').innerHTML = `
                    <tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--danger);">Failed to load logs.</td></tr>
                `;
            }
        }
    </script>
</body>
</html>
