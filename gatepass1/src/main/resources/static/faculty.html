<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard | GatePass Pro</title>
    <!-- Phospor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="ph-fill ph-chalkboard-teacher"></i> Faculty Portal
        </div>
        <div class="flex items-center gap-4">
            <span>Welcome, <strong class="display-username text-gradient">Faculty</strong></span>
            <button class="btn btn-outline" data-action="logout" style="padding: 0.5rem 1rem;">
                <i class="ph-bold ph-sign-out"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container" style="margin-top: 2rem;">
        
        <div class="glass-panel animate-fade-in" style="padding: 1.5rem;">
            <div class="flex justify-between items-center" style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem;">
                <h3><i class="ph-fill ph-list-checks"></i> Pending Requests</h3>
                <button class="btn btn-outline" onclick="loadAllPasses()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
                    <i class="ph-bold ph-arrows-clockwise"></i> Refresh
                </button>
            </div>

            <div id="requestsContainer" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
                <!-- Loading State -->
                <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 2rem;">
                    <i class="ph ph-spinner ph-spin" style="font-size: 2rem;"></i>
                    <p>Loading requests...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Protected Route Check
            const user = checkAuth('FACULTY');
            if(!user) return;

            loadAllPasses();
            // Make loadAllPasses globally accessible for the refresh button
            window.loadAllPasses = loadAllPasses;
        });

        async function loadAllPasses() {
            const container = document.getElementById('requestsContainer');
            try {
                const response = await fetch(`${API_BASE_URL}/pass/all`);
                let data = await response.json();
                
                container.innerHTML = '';
                
                // Show ONLY pending passes, or allow seeing all but highlight pending
                // Let's sort by ID descending
                data.sort((a,b) => b.id - a.id);

                if(data.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 2rem;">
                            <i class="ph-fill ph-empty" style="font-size: 3rem; opacity: 0.5;"></i>
                            <p>No gate pass requests found.</p>
                        </div>
                    `;
                    return;
                }

                data.forEach(pass => {
                    let badgeClass = 'badge-pending';
                    if(pass.status === 'APPROVED') badgeClass = 'badge-approved';
                    if(pass.status === 'REJECTED') badgeClass = 'badge-rejected';

                    if(pass.status === 'UNAPPROVED') badgeClass = 'badge-rejected'; 
                    // Backend uses UNAPPROVED or REJECTED randomly maybe, let's treat UNAPPROVED as rejected.

                    const card = document.createElement('div');
                    card.className = 'glass-card flex flex-col gap-2';
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center" style="margin-bottom: 0.5rem;">
                            <span class="badge ${badgeClass}" id="badge-${pass.id}">${pass.status}</span>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">ID: #${pass.id}</span>
                        </div>
                        
                        <div style="margin-bottom: 0.5rem;">
                            <strong style="color: var(--text-main); font-size: 1.1rem;">${pass.studentName}</strong>
                            <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 0.5rem;">(${pass.rollNo})</span>
                        </div>
                        
                        <p style="font-size: 0.95rem; color: var(--text-main); padding: 0.5rem; background: rgba(0,0,0,0.2); border-radius: 4px; border-left: 2px solid var(--border-glass);">
                            "${pass.reason}"
                        </p>

                        <div class="flex justify-between items-center" style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-muted);">
                            <span><i class="ph-fill ph-calendar"></i> ${pass.timeSlot}</span>
                            ${pass.aiSuggestion ? 
                              `<span title="${pass.aiSuggestion}"><i class="ph-fill ph-magic-wand text-gradient"></i> AI Checked</span>` : ''}
                        </div>

                        ${pass.status === 'PENDING' ? `
                            <div class="flex gap-2" style="margin-top: 1rem;" id="actions-${pass.id}">
                                <button class="btn btn-success" style="flex: 1; padding: 0.5rem;" onclick="updatePass(${pass.id}, 'approve')">
                                    <i class="ph-bold ph-check"></i> Approve
                                </button>
                                <button class="btn btn-danger" style="flex: 1; padding: 0.5rem;" onclick="updatePass(${pass.id}, 'unapprove')">
                                    <i class="ph-bold ph-x"></i> Reject
                                </button>
                            </div>
                        ` : `
                            <div class="flex gap-2" style="margin-top: 1rem;" id="actions-${pass.id}">
                                <button class="btn btn-outline" style="flex: 1; padding: 0.5rem; opacity: 0.5;" disabled>
                                    Processed
                                </button>
                            </div>
                        `}
                    `;
                    container.appendChild(card);
                });
            } catch(e) {
                container.innerHTML = `<p style="color: var(--danger);">Failed to load requests.</p>`;
            }
        }

        async function updatePass(id, action) {
            try {
                // Action is either 'approve' or 'unapprove' based on the backend API
                const endpoint = `${API_BASE_URL}/pass/${action}/${id}`;
                
                const response = await fetch(endpoint, {
                    method: 'PUT'
                });

                if(response.ok) {
                    showToast(`Pass request ${action}d successfully.`, 'success');
                    // Fast UI update without massive reload
                    const badge = document.getElementById(`badge-${id}`);
                    const actions = document.getElementById(`actions-${id}`);
                    
                    if(action === 'approve') {
                        badge.className = 'badge badge-approved';
                        badge.textContent = 'APPROVED';
                    } else {
                        badge.className = 'badge badge-rejected';
                        badge.textContent = 'UNAPPROVED';
                    }

                    actions.innerHTML = `
                        <button class="btn btn-outline" style="flex: 1; padding: 0.5rem; opacity: 0.5;" disabled>
                            Processed
                        </button>
                    `;
                } else {
                    showToast('Failed to update pass.', 'error');
                }
            } catch(e) {
                showToast('Server error.', 'error');
            }
        }
    </script>
</body>
</html>
